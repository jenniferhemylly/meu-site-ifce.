
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Objetos</title>
</head>
<body>
    <header>
        <h1>Área de Administração</h1>
    </header>

    <nav>
        <a href="index.html">Página Inicial</a> |
        <a href="login.html">Login</a> |
        <a href="objetos.html">Cadastro de Objetos</a> |
        <a href="usuarios.html">Cadastro de Usuários</a> |
        <a href="autor.html">Sobre o Autor</a>
    </nav>

    <main>
        <h2>Cadastro de Objetos</h2>

        <form>
            <label for="nome">Nome do objeto:</label>
            <input type="text" id="nome" name="nome" required>

            <br><br>

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" name="descricao"></textarea>

            <br><br>

            <label for="imagem">Endereço da imagem:</label>
            <input type="text" id="imagem" name="imagem">

            <br><br>

            <button type="submit">Cadastrar objeto</button>
        </form>

        <h2>Objetos cadastrados</h2>

        <table border="1">
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
            <tr>
                <td>Exemplo de objeto</td>
                <td>Descrição do objeto</td>
                <td>
                    <button type="button">Editar</button>
                    <button type="button">Apagar</button>
                </td>
            </tr>
        </table>
    </main>

    <footer>
        <p>Autor: Jennifer Hemylly</p>
        <a href="autor.html">Sobre o Autor</a>
    </footer>
</body>
</html>
